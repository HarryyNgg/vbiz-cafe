name: vbiz-cafe

on:
  schedule:
    - cron: "*/30 * * * *"   # ticker: chỉ quét RSS, không AI
    - cron: "0 0 * * *"      # 7:00 sáng VN: bản tin Gemini
  workflow_dispatch: {}       # bấm tay = pha bản tin đầy đủ

permissions:
  contents: write

concurrency:
  group: vbiz-brew
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Brew
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            python -m agency.run              # digest đầy đủ
          else
            python -m agency.run --headlines  # chỉ ticker
          fi

      - name: Commit & push
        run: |
          git config user.name "vbiz-cafe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: brew $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
