name: vbiz-cafe

on:
  schedule:
    # Lịch GitHub free chỉ là "cố gắng" và hay bỏ các mốc :00/:30 (giờ cao điểm), nên chạy lệch phút.
    # Bản tin sáng không có lịch riêng: lượt nào chạy sau 7:00 VN mà hôm nay chưa có bản tin thì tự pha (--auto).
    - cron: "13 * * * *"      # dự phòng; nhịp chính là cron-job.org gọi workflow_dispatch mỗi giờ
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = cập nhật tin (tự pha bản tin sáng nếu chưa có); full = pha lại bản tin ngay"
        type: choice
        options: [auto, full]
        default: auto

permissions:
  contents: write

concurrency:
  group: vbiz-brew
  cancel-in-progress: false

jobs:
  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Brew
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            python -m agency.run              # digest đầy đủ
          else
            python -m agency.run --auto       # ticker, hoặc digest nếu sáng nay chưa có
          fi

      - name: Commit & push
        run: |
          git config user.name "vbiz-cafe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "chore: brew $(date -u '+%Y-%m-%d %H:%M') UTC"
          # GitHub thỉnh thoảng từ chối push tạm thời ("fatal error in commit_refs"): thử lại 3 lần
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            echo "push lần $i lỗi, thử lại sau 15s"
            sleep 15
          done
          exit 1
